name: Contract tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install pinned Almide release
        run: ./scripts/install-almide.sh
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:workers
      - run: npm run test:workers
      - run: npm run package:faas
      - name: Install staged function dependencies
        run: |
          npm ci --prefix build/packages/google-cloud-functions --omit=dev --ignore-scripts
          npm ci --prefix build/packages/azure-functions --omit=dev --ignore-scripts
      - run: npm run test:google-framework
      - run: npm run test:staged-functions
